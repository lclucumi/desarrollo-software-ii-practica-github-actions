name: Construir y Probar

on:
  push:
  pull_request:
    branches: [ practica/Brayan-Urquijo ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Obtener El Codigo
        uses: actions/checkout@v7

      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Verificar version de Java
        run: java --version

      - name: Preparar Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Construir y ejecutar pruebas
        run: ./gradlew clean build

      - name: Guardar el reporte de pruebas
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: Reporte-Pruebas
          path: build/reports/tests/test
          if-no-files-found: warn
