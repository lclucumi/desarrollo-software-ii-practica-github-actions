name: Construir y probar

on:
  push:
  pull_request:
    branches: [ practica/Nicolle-Hoyos ]

permissions:
  contests: read

jobs:
  build:
    runs-on: ubuntu-latest
    
    Steps: 
      - name: Obtener el codigo
        uses: actions/checkout@v7
        
      - name: Preparar Java
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
  
        - name: Preparar Gradle
          uses: gradle/actions/setuo-gradle@v6
  
        - name: Construir y ejecutar pruebas
          uses: ./gradlew clean build
  
        - neme: Guardar el reporte de pruebas
          if: always()
          uses: actions/upload-artifact@v7
          with:
            name: reporte-pruebas
            path: build/reports/tests/test
            if-no-files-found: warn


        
        
