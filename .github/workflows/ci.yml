name: Construir y Probar

on: 
  push:
  pull_request:
    branches: [ practica/SamuelAgudelo ]


permissions:
  contents: read


jobs:
  build:
    runs-on: ubuntu-latest

  steps:
      - name: Obtener el codigo
        uses: action/checkout@v7
        
      - name: Preparar Java
        uses: action/setup-java@v6
        with:
          distrbution: temurin
          java-version: '21'
          
    - name: Preparar Gradle
      uses: gradle/actions/setup-gradle@v6

    - name: Construir y ejecutar pruebas
      uses: ./gradlew clean build 

   - name: Guardar el reporte de pruebas 
     if: always()     
     uses: actions/upload-artifact@v7
     with:
       name: reporte-pruebas
       path: build/reports/tests/test/
       if-no-files-found: warn
