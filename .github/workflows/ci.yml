name: Construir y Probar

on: 
  push:
  pull_request:
    branches: [practica/Brayan-Urquijo]

 permissions:
   contents: read
 
jobs:
  build:
    runs-on: ubuntu-latest

  steps:
  - name: Obtener El Codigo
    uses: actions/checkout@v7
  
  - name: Preparar Java
    uses: actions/setup-java@v6
    with:
      distribution: temurin
      java-version: '21'
  - run: java --version

  - name: Preparar Gradle
    uses: gradle/actions/setup-gradle@v6

  - name: Construir y ejecutar pruebas
    uses: ./gradlew clen build

  - name: Guardar el reporte de pruebas
  if: always()
  uses: actions/upload-artifact@v7
  with:
    name: Reporte-Pruebas
    patch: build/reports/tests/test
    if-no-files-found: warn
    
