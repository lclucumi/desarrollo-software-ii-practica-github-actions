name: contruir y probar

on: 
  push:
  pull_request:
    branches: [practica/scarllysvallecilla]

permissions:
  contents: read 

jobs:
  build:
   runs-on: ubuntu-latest


   steps:
    - name: obtener el codigo
      uses: actions/checkout@v7

    - name: preparar java
      uses: actions/setup-java@6
      with:
       distribution: temurin
       java-version: '21'

    - name: preparar gradle
      uses: gradle/actions/setup-gradle@v6

    - name: construir y ejecutar pruebas 
      uses: ./gradlew cleam build

    - name: guardar el repo de prueba
      if: always()
      uses: actions/upload-artifact@v7
      with:
       name: reporte-pruebas 
       path: build/reports/tests/test
       if-no-files-found: warn
    
