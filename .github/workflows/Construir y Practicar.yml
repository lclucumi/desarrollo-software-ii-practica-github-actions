name: Construir y Probar

on:
  push:
  pull_request:
    branches: [practica/karen-gomez]

permissions: 
  contents: read

jobs:
  build:
      runs-on: ubuntu-latest

  steps:
    - name: Obtener el código
      uses: actions/checkout@uv7

    - name: Preparar Java
      uses: actions/setup-java@v6
      with:
        distribution: temurin
        java-version: '21'

    - name: Preparar Grade
      uses: gradle/actions/setup-gradle@v6

    - name: Construir y Ejecutar pruebas
      uses: ./gradlew clean build

    - name: Guardar el reporte de pruebas
    if: always()
      uses: actions/upload-artifact@v7
      with:
         name: Reporte-pruebas
         path: build/reports/tests/test
         if-no-files-found: warn







      
